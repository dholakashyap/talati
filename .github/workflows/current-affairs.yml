# Daily current affairs for the Talati app: reads the news feeds in
# tools/ca/sources.json, writes ca/<date>.json and ca/index.json, commits them.
# Needs repository secrets: GEMINI_API_KEY (and optionally GROQ_API_KEY,
# OPENROUTER_API_KEY as fallbacks). Settings → Secrets and variables → Actions.
name: Current affairs

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
    - cron: "30 12 * * *"  # 18:00 IST, picks up the day's later news
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: current-affairs
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grab and write
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python tools/ca/grab.py --out .
      - name: Commit new items
        run: |
          git config user.name "talati-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ca
          git diff --cached --quiet || git commit -m "Current affairs $(date -u +%F)"
          git push
